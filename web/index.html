<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Astro Blaster</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05060d;
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            color: #cdd6ff;
        }
        /* Center the canvas; it keeps the game's 4:3 aspect ratio. */
        #wrap {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            background: #05060d;
            max-width: 100%;
            max-height: 100%;
            outline: none;
            box-shadow: 0 0 40px rgba(80, 120, 255, 0.25);
        }
        #hint {
            position: absolute;
            bottom: 8px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            opacity: 0.55;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <canvas id="glcanvas" tabindex="1" width="1024" height="768"></canvas>
    </div>
    <div id="hint">A / D &amp; Arrows to turn &middot; W / Up to thrust &middot; Space to fire &middot; Enter to start</div>

    <script src="./mq_js_bundle.js"></script>
    <script>
        // Keep keyboard focus on the canvas so input is captured immediately.
        const canvas = document.getElementById("glcanvas");
        window.addEventListener("load", () => canvas.focus());
        canvas.addEventListener("click", () => canvas.focus());
        // Stop arrows / space from scrolling the page.
        window.addEventListener("keydown", (e) => {
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Space"].includes(e.key)) {
                e.preventDefault();
            }
        }, { passive: false });

        load("./astro_blaster.wasm");
    </script>
</body>
</html>
