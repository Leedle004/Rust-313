<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <title>Rust Space Shooter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #05050a;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        canvas {
            outline: none;
            image-rendering: pixelated;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
            /* macroquad sizes the backing framebuffer from this CSS size
               (clientWidth/clientHeight), so it must match the game's
               logical resolution (480x720) or gameplay will render into a
               tiny/default-sized canvas. */
            width: 480px;
            height: 720px;
        }
    </style>
</head>

<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <script src="mq_js_bundle.js"></script>
    <script>load("pkg/rust-313.wasm");</script>
</body>

</html>
