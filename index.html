<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05060f" />
  <title>星际战机 · Star Striker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 L26 26 L16 20 L6 26 Z' fill='%2338e1ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <div class="game-frame">
      <canvas id="game"></canvas>

      <!-- HUD -->
      <div id="hud" class="hud hidden">
        <div class="hud-left">
          <div class="hud-item">
            <span class="hud-label">得分</span>
            <span id="score" class="hud-value">0</span>
          </div>
          <div class="hud-item">
            <span class="hud-label">关卡</span>
            <span id="level" class="hud-value">1</span>
          </div>
        </div>
        <div class="hud-right">
          <div class="hud-item">
            <span class="hud-label">最高</span>
            <span id="highscore" class="hud-value">0</span>
          </div>
          <div class="hud-item lives">
            <span class="hud-label">生命</span>
            <span id="lives" class="hud-value">♥♥♥</span>
          </div>
        </div>
      </div>

      <!-- Power-up / shield bar -->
      <div id="statusbar" class="statusbar hidden">
        <div class="bar shield-bar">
          <span class="bar-label">护盾</span>
          <div class="bar-track"><div id="shieldFill" class="bar-fill shield"></div></div>
        </div>
        <div class="bar weapon-bar">
          <span class="bar-label">武器</span>
          <span id="weaponName" class="weapon-name">单发</span>
        </div>
      </div>

      <!-- Start screen -->
      <div id="startScreen" class="overlay">
        <div class="overlay-card">
          <h1 class="title">星际战机</h1>
          <p class="subtitle">STAR STRIKER</p>
          <div class="instructions">
            <p><b>移动</b> ←↑↓→ / WASD &nbsp;·&nbsp; <b>射击</b> 空格(可长按)</p>
            <p><b>暂停</b> P / Esc &nbsp;·&nbsp; 手机端可触屏操作</p>
            <p>击毁敌机得分，拾取道具升级武器，小心 BOSS！</p>
          </div>
          <button id="startBtn" class="btn btn-primary">开始游戏</button>
          <p class="hint">提示：长按空格持续射击</p>
        </div>
      </div>

      <!-- Pause screen -->
      <div id="pauseScreen" class="overlay hidden">
        <div class="overlay-card">
          <h2 class="title small">已暂停</h2>
          <button id="resumeBtn" class="btn btn-primary">继续</button>
          <button id="restartBtn1" class="btn btn-ghost">重新开始</button>
        </div>
      </div>

      <!-- Game over screen -->
      <div id="gameOverScreen" class="overlay hidden">
        <div class="overlay-card">
          <h2 class="title small">游戏结束</h2>
          <div class="final-stats">
            <div><span class="hud-label">本局得分</span><span id="finalScore" class="big">0</span></div>
            <div><span class="hud-label">最高纪录</span><span id="finalHigh" class="big">0</span></div>
          </div>
          <p id="newRecord" class="record hidden">🏆 新纪录！</p>
          <button id="restartBtn2" class="btn btn-primary">再来一局</button>
        </div>
      </div>

      <!-- Mobile touch controls -->
      <div id="touchControls" class="touch-controls hidden">
        <div id="joystick" class="joystick"><div id="joystickKnob" class="joystick-knob"></div></div>
        <button id="fireBtn" class="fire-btn">发射</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
