<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>星际防线 - 射击游戏</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="hero-panel" aria-labelledby="game-title">
        <p class="eyebrow">Arcade Shooter</p>
        <h1 id="game-title">星际防线</h1>
        <p class="intro">
          驾驶防御飞船拦截来袭无人机。移动、射击、躲避冲撞，在生命耗尽前尽可能拿到高分。
        </p>

        <div class="controls-card" aria-label="操作说明">
          <h2>操作</h2>
          <ul>
            <li><kbd>A</kbd>/<kbd>D</kbd> 或 <kbd>←</kbd>/<kbd>→</kbd> 移动</li>
            <li><kbd>空格</kbd> 发射能量弹</li>
            <li><kbd>P</kbd> 暂停或继续</li>
            <li><kbd>Enter</kbd> 开始或重新开始</li>
          </ul>
        </div>
      </section>

      <section class="play-panel" aria-label="游戏区域">
        <div class="hud" aria-live="polite">
          <div>
            <span>分数</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span>最高分</span>
            <strong id="best-score">0</strong>
          </div>
          <div>
            <span>生命</span>
            <strong id="lives">3</strong>
          </div>
          <div>
            <span>等级</span>
            <strong id="level">1</strong>
          </div>
        </div>

        <div class="canvas-wrap">
          <canvas id="game-canvas" width="900" height="620" aria-label="星际防线游戏画布"></canvas>
          <div id="overlay" class="overlay">
            <div class="overlay-card">
              <p id="overlay-kicker">准备出击</p>
              <h2 id="overlay-title">按 Enter 开始</h2>
              <p id="overlay-message">用方向键移动，空格射击。敌机会越来越快。</p>
              <button id="start-button" type="button">开始游戏</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="src/game.js"></script>
  </body>
</html>
