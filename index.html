<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>星际防线 - 射击游戏</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="hero-panel" aria-labelledby="game-title">
        <p class="eyebrow">Canvas Shooter</p>
        <h1 id="game-title">星际防线</h1>
        <p class="intro">
          驾驶防线战机，在陨石和敌机的夹击中坚持更久。移动、射击、躲避并争取最高分。
        </p>

        <div class="controls-card" aria-label="游戏操作说明">
          <h2>操作</h2>
          <ul>
            <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或方向键移动</li>
            <li><kbd>Space</kbd> 发射能量弹</li>
            <li><kbd>P</kbd> 暂停 / 继续</li>
            <li><kbd>R</kbd> 重新开始</li>
          </ul>
        </div>
      </section>

      <section class="game-panel" aria-label="射击游戏">
        <div class="hud" aria-live="polite">
          <span>分数 <strong id="score">0</strong></span>
          <span>生命 <strong id="lives">3</strong></span>
          <span>波次 <strong id="wave">1</strong></span>
        </div>

        <div class="canvas-wrap">
          <canvas id="game" width="960" height="600" aria-label="星际防线游戏画布"></canvas>
          <div id="overlay" class="overlay">
            <h2>星际防线</h2>
            <p>点击开始，保护基地免受入侵。</p>
            <button id="start-button" type="button">开始游戏</button>
          </div>
        </div>

        <p class="status-line" id="status-line">准备就绪：点击开始或按 Space 开火。</p>
      </section>
    </main>

    <script src="src/game.js" defer></script>
  </body>
</html>
