<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>星际射击 · Star Striker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305060f'/%3E%3Cpath d='M16 4 L26 26 L16 21 L6 26 Z' fill='%2338e1ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-shell">
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-left">
        <div class="hud-stat">
          <span class="hud-label">分数</span>
          <span id="score" class="hud-value">0</span>
        </div>
        <div class="hud-stat">
          <span class="hud-label">最高</span>
          <span id="high-score" class="hud-value">0</span>
        </div>
      </div>
      <div class="hud-center">
        <div id="wave-label" class="hud-wave">第 1 波</div>
      </div>
      <div class="hud-right">
        <div id="lives" class="hud-lives"></div>
        <button id="pause-btn" class="pause-btn" aria-label="暂停">⏸</button>
      </div>
    </div>

    <!-- Start / Menu screen -->
    <div id="menu" class="overlay">
      <div class="overlay-card">
        <h1 class="title">星际射击</h1>
        <p class="subtitle">STAR STRIKER</p>
        <div class="controls-hint">
          <p><b>移动</b>：方向键 / WASD / 鼠标 / 触屏</p>
          <p><b>射击</b>：空格 / 鼠标左键（自动连发）</p>
          <p><b>暂停</b>：P / Esc</p>
        </div>
        <button id="start-btn" class="btn btn-primary">开始游戏</button>
      </div>
    </div>

    <!-- Pause screen -->
    <div id="pause" class="overlay hidden">
      <div class="overlay-card">
        <h2 class="title-sm">已暂停</h2>
        <button id="resume-btn" class="btn btn-primary">继续</button>
        <button id="restart-btn" class="btn">重新开始</button>
      </div>
    </div>

    <!-- Game over screen -->
    <div id="gameover" class="overlay hidden">
      <div class="overlay-card">
        <h2 class="title-sm">游戏结束</h2>
        <div class="result">
          <div class="result-row"><span>本局得分</span><span id="final-score">0</span></div>
          <div class="result-row"><span>到达波次</span><span id="final-wave">1</span></div>
          <div class="result-row"><span>最高纪录</span><span id="final-high">0</span></div>
        </div>
        <button id="again-btn" class="btn btn-primary">再来一局</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
