[package]
name = "ai-crypto-os"
version = "0.1.0"
edition = "2021"
description = "AI 币圈 OS — 一个纯 AI 驱动的币圈 App 操作系统（浏览器桌面环境 + Rust 后端）"
license = "MIT"

[[bin]]
name = "ai-crypto-os"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
